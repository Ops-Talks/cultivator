# Bitbucket Pipelines - Cultivator reference pipeline
#
# Requires the following repository variables (Repository settings > Repository variables):
#   CULTIVATOR_VERSION       e.g. v0.4.10
#   TOFU_VERSION             e.g. 1.11.5
#   TERRAGRUNT_VERSION       e.g. 0.99.1
#   CULTIVATOR_ROOT          e.g. providers
#   CULTIVATOR_ENV           leave empty to run all stacks under CULTIVATOR_ROOT
#   CULTIVATOR_PARALLELISM   e.g. 4
#   REPO_ACCESS_TOKEN        Repository Access Token with the `pullrequest`
#                            write scope, used to post the plan as a PR comment.
#                            Mark the variable as Secured. App Passwords are
#                            deprecated by Atlassian; use a Repository Access
#                            Token (or an API token for user-level scripts).
#                            See Repository settings > Access tokens.
#
# Cloud credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, etc.) should
# also be stored as repository or deployment variables. Long-lived secrets are
# the legacy path: prefer Bitbucket OIDC (BITBUCKET_STEP_OIDC_TOKEN) when the
# target cloud supports it.

image: alpine:3.21

definitions:
  # Anchored steps declared under definitions.steps are referenced by alias in
  # the `pipelines` section. This keeps the install script in a single place.
  # YAML merge keys do not merge sequences, so we declare full steps and
  # reference them as-is rather than trying to merge script lists.
  steps:
    - step: &doctor-step
        name: Doctor
        script:
          - apk add --no-cache wget unzip curl ca-certificates
          - wget -q -O /usr/local/bin/terragrunt
              https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64
          - chmod +x /usr/local/bin/terragrunt
          - wget -q -O /usr/local/bin/cultivator
              https://github.com/Ops-Talks/cultivator/releases/download/${CULTIVATOR_VERSION}/cultivator-linux-amd64
          - chmod +x /usr/local/bin/cultivator
          - cultivator doctor --root "$CULTIVATOR_ROOT"

    - step: &plan-step
        name: Plan
        # clone.depth defaults to 50 commits in Bitbucket Pipelines. Magic Mode
        # needs the merge base with the destination branch, so request the full
        # history. Cultivator also auto-fetches the destination branch when the
        # ref is missing (see --no-auto-fetch to opt out).
        clone:
          depth: full
        script:
          - apk add --no-cache wget unzip curl jq ca-certificates git bash
          - wget -q https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip
          - unzip -q tofu_${TOFU_VERSION}_linux_amd64.zip -d /usr/local/bin
          - rm tofu_${TOFU_VERSION}_linux_amd64.zip
          - wget -q -O /usr/local/bin/terragrunt
              https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64
          - chmod +x /usr/local/bin/terragrunt
          - wget -q -O /usr/local/bin/cultivator
              https://github.com/Ops-Talks/cultivator/releases/download/${CULTIVATOR_VERSION}/cultivator-linux-amd64
          - chmod +x /usr/local/bin/cultivator
          - |
            set -euo pipefail

            ARGS=(
              --root "$CULTIVATOR_ROOT"
              --parallelism "$CULTIVATOR_PARALLELISM"
              --non-interactive=true
              --changed-only
            )

            if [ -n "$CULTIVATOR_ENV" ]; then
              ARGS+=(--env "$CULTIVATOR_ENV")
            fi

            set +e
            cultivator plan "${ARGS[@]}" 2>&1 | tee plan_output.txt
            CULTIVATOR_EXIT="${PIPESTATUS[0]}"
            set -e

            if [ -z "${REPO_ACCESS_TOKEN:-}" ]; then
              echo "REPO_ACCESS_TOKEN not set; skipping PR comment"
            else
              PLAN_OUTPUT=$(cat plan_output.txt)
              COMMENT=$(printf '## Cultivator Plan\n\n```\n%s\n```' "${PLAN_OUTPUT}")
              curl --silent --show-error --fail \
                --header "Authorization: Bearer ${REPO_ACCESS_TOKEN}" \
                --header "Content-Type: application/json" \
                --request POST \
                "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/pullrequests/${BITBUCKET_PR_ID}/comments" \
                --data "$(jq -n --arg body "${COMMENT}" '{"content":{"raw":$body}}')"
            fi

            exit "$CULTIVATOR_EXIT"
        artifacts:
          - plan_output.txt

    - step: &apply-step
        name: Apply
        trigger: manual
        deployment: production
        clone:
          depth: full
        script:
          - apk add --no-cache wget unzip curl jq ca-certificates git bash
          - wget -q https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip
          - unzip -q tofu_${TOFU_VERSION}_linux_amd64.zip -d /usr/local/bin
          - rm tofu_${TOFU_VERSION}_linux_amd64.zip
          - wget -q -O /usr/local/bin/terragrunt
              https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64
          - chmod +x /usr/local/bin/terragrunt
          - wget -q -O /usr/local/bin/cultivator
              https://github.com/Ops-Talks/cultivator/releases/download/${CULTIVATOR_VERSION}/cultivator-linux-amd64
          - chmod +x /usr/local/bin/cultivator
          - |
            set -euo pipefail

            ARGS=(
              --root "$CULTIVATOR_ROOT"
              --parallelism "$CULTIVATOR_PARALLELISM"
              --non-interactive=true
              --auto-approve=true
            )

            if [ -n "$CULTIVATOR_ENV" ]; then
              ARGS+=(--env "$CULTIVATOR_ENV")
            fi

            cultivator apply "${ARGS[@]}" 2>&1 | tee apply_output.txt
        artifacts:
          - apply_output.txt

pipelines:
  # Pull-request pipelines.
  #
  # Bitbucket merges the destination branch into the source branch before the
  # script runs, so `git diff origin/<destination>` may surface only the merge
  # delta. Pair --changed-only with clone.depth: full and Cultivator's
  # auto-fetch (default in PR builds) for reliable results.
  #
  # Glob patterns under pull-requests: match the SOURCE branch.
  # Pull requests opened from forked repositories do NOT trigger this pipeline.
  pull-requests:
    "**":
      - step: *doctor-step
      - step: *plan-step

  # Default-branch pipeline (runs after PR merge).
  #
  # `pull-requests` and `branches` are independent: a push to `main` only fires
  # `branches.main`, while a PR push fires `pull-requests` (plus any matching
  # `branches:` entry for the source branch). Limit `branches:` to `main` to
  # avoid two pipelines starting in parallel for the same event.
  branches:
    main:
      - step: *doctor-step
      - step: *apply-step
